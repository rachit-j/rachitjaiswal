<header class="site-header" data-header>
  <div class="site-shell site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Rachit Jaiswal — Home">RJ<span aria-hidden="true">.</span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" data-menu-toggle>
      <span class="sr-only" data-menu-label>Open navigation</span><span aria-hidden="true">Menu</span>
    </button>
    <nav id="primary-navigation" class="primary-nav" aria-label="Primary navigation" data-menu>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/work/' | relative_url }}"{% if page.url contains '/work' or page.url contains '/projects/' %} aria-current="page"{% endif %}>Work</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing' %} aria-current="page"{% endif %}>Writing</a>
      <span class="nav-divider" aria-hidden="true"></span>
      <a href="{{ site.github_url }}" rel="noopener noreferrer" target="_blank">GitHub <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>
      <a href="{{ site.linkedin_url }}" rel="noopener noreferrer" target="_blank">LinkedIn <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>
    </nav>
  </div>
</header>
